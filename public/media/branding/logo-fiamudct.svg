  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#153d40" />
      <stop offset="100%" stop-color="#28666a" />
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="48" fill="#edf1ef" />
